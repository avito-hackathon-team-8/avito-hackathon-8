global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-service
    static_configs:
      - targets: ["api-service:8090"]
  - job_name: pet-state-service
    static_configs:
      - targets: ["pet-state-service:8092"]
  - job_name: daily-tasks-service
    static_configs:
      - targets: ["daily-tasks-service:8091"]
