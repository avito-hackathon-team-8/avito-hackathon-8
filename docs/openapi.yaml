openapi: 3.0.3
info:
  title: Коробыш API
  version: 1.0.0
  description: |
    Контракт API для механик ежемесячного рейтинга, еженедельных наград за вход
    и ежедневных заданий.

    Правила работы со временем:
    - все временные метки передаются в формате RFC3339 и часовом поясе UTC;
    - периоды рейтинга соответствуют календарным месяцам в UTC;
    - циклы еженедельных входов соответствуют неделям ISO с понедельника по воскресенье в UTC;
    - сервер является источником истины для идентификатора игрока, дат, размеров наград,
      уровней, заработанных листьев, позиций и статуса проверки.

servers:
  - url: /
    description: Бэкенд приложения

tags:
  - name: Состояние сервиса
    description: Проверка доступности и готовности бэкенда.
  - name: Авторизация
    description: Вход по одноразовому коду из электронной почты и получение текущего пользователя.
  - name: Рейтинг
    description: Ежемесячный рейтинг игроков, рассчитанный по последнему опубликованному ежедневному снимку.
  - name: Еженедельный вход
    description: Состояние еженедельной награды за активность и операции её получения.
  - name: Ежедневные задания
    description: Задания текущего дня, прогресс их выполнения и получение наград.
  - name: Ежедневная сводка
    description: Итоги активности пользователя за текущий день и обновления в реальном времени.
  - name: Внешняя активность
    description: Контракт внешнего сервиса активности, который использует бэкенд.

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [Состояние сервиса]
      operationId: getHealth
      summary: Проверить готовность API
      description: Возвращает текущее состояние бэкенда и время сервера в UTC.
      security: []
      responses:
        '200':
          description: Сервис работает и готов принимать запросы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                default:
                  value:
                    service: go-api
                    status: ready
                    time: '2026-08-04T12:00:00Z'

  /api/app/auth/request-otp:
    post:
      tags: [Авторизация]
      operationId: requestOtp
      summary: Запросить одноразовый код для входа
      description: |
        Нормализует адрес электронной почты, создаёт пользователя при первом обращении
        и отправляет новый одноразовый код. Ранее выданный код для этого пользователя
        становится недействительным.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            examples:
              default:
                value:
                  email: user@example.com
      responses:
        '200':
          description: Одноразовый код успешно отправлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
              examples:
                default:
                  value:
                    sent: true
        '400':
          description: Тело запроса некорректно или содержит недопустимый адрес электронной почты.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Не удалось создать или отправить одноразовый код.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /api/app/auth/verify-otp:
    post:
      tags: [Авторизация]
      operationId: verifyOtp
      summary: Подтвердить одноразовый код
      description: |
        Проверяет одноразовый код и возвращает JWT вместе с данными пользователя.
        Код можно ввести неверно не более трёх раз; просроченный или успешно
        использованный код становится недействительным.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerificationRequest'
            examples:
              default:
                value:
                  email: user@example.com
                  code: '12345678'
      responses:
        '200':
          description: Код подтверждён, JWT выпущен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                default:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                    record:
                      id: 72482c10-6976-4823-a835-333333333333
                      email: user@example.com
                      verified: true
        '400':
          description: Тело запроса некорректно либо код недействителен или просрочен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Не удалось проверить код или выпустить JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /api/app/auth/me:
    get:
      tags: [Авторизация]
      operationId: getCurrentUser
      summary: Получить текущего пользователя
      description: Определяет пользователя по JWT из заголовка `Authorization`.
      responses:
        '200':
          description: Данные авторизованного пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                default:
                  value:
                    id: 72482c10-6976-4823-a835-333333333333
                    email: user@example.com
                    verified: true
        '401':
          description: JWT отсутствует, недействителен или принадлежит неизвестному пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Не удалось загрузить пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /api/v1/tasks:
    get:
      tags: [Ежедневные задания]
      operationId: getDailyTasks
      summary: Получить задания на текущий день
      description: |
        Возвращает уровень питомца и полный список из четырёх заданий текущего дня.
        Задания, недоступные на текущем уровне, также входят в список со статусом `LOCKED`.
        Прогресс обновляется на основании подтверждённых действий пользователя.
      responses:
        '200':
          description: Задания и их текущий прогресс.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTasksResponse'
              examples:
                default:
                  value:
                    petLevel: 4
                    tasks:
                      - taskId: 8f123af2-24c5-4ff7-b114-111111111111
                        slot: 1
                        type: OPEN_NOTIFICATIONS
                        description: Открыть 5 уведомлений
                        currentCount: 5
                        targetCount: 5
                        rewardLeaves: 45
                        requiredLevel: 1
                        status: CLAIMED
                      - taskId: 6ab41fc5-1a5f-4db4-9129-222222222222
                        slot: 2
                        type: ADD_TO_FAVORITES
                        description: Добавить 3 объявления в избранное
                        currentCount: 3
                        targetCount: 3
                        rewardLeaves: 45
                        requiredLevel: 1
                        status: COMPLETED
                      - taskId: 72482c10-6976-4823-a835-333333333333
                        slot: 3
                        type: PUBLISH_LISTING
                        description: Опубликовать 1 объявление
                        currentCount: 0
                        targetCount: 1
                        rewardLeaves: 50
                        requiredLevel: 5
                        status: LOCKED
                      - taskId: b826c297-bc5f-4e1a-93d5-444444444444
                        slot: 4
                        type: COMPLETE_DEAL
                        description: Совершить покупку или продажу
                        currentCount: 0
                        targetCount: 1
                        rewardLeaves: 60
                        requiredLevel: 10
                        status: LOCKED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/progress:
    get:
      tags: [Ежедневные задания]
      operationId: getDailyTasksProgress
      summary: Получить количество выполненных заданий за день
      description: |
        Возвращает компактный прогресс для отображения на страницах приложения.
        `completedCount` учитывает задания со статусами `COMPLETED` и `CLAIMED`.
        В `totalCount` входят все четыре задания, включая недоступные по уровню.
      responses:
        '200':
          description: Количество выполненных заданий за текущий день.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTasksProgressResponse'
              examples:
                default:
                  value:
                    completedCount: 2
                    totalCount: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{taskId}/claim:
    post:
      tags: [Ежедневные задания]
      operationId: claimDailyTaskReward
      summary: Получить награду за конкретное задание
      description: |
        Начисляет листья за выполненное задание текущего дня и меняет его статус
        с `COMPLETED` на `CLAIMED`. Награду за одно задание можно получить только один раз.
        Тело запроса и ключ идемпотентности для MVP не требуются.
      parameters:
        - name: taskId
          in: path
          required: true
          description: Идентификатор задания из ответа `GET /api/v1/tasks`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Награда начислена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTaskClaimResponse'
              examples:
                default:
                  value:
                    taskId: 6ab41fc5-1a5f-4db4-9129-222222222222
                    rewardLeaves: 45
                    status: CLAIMED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Задание недоступно на текущем уровне питомца.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                taskLocked:
                  value:
                    code: TASK_LOCKED
                    message: Задание недоступно на текущем уровне питомца.
        '404':
          description: Задание текущего дня или игрок не найдены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                taskNotFound:
                  value:
                    code: TASK_NOT_FOUND
                    message: Задание текущего дня не найдено.
        '409':
          description: Задание ещё не выполнено либо награда уже получена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                taskNotCompleted:
                  value:
                    code: TASK_NOT_COMPLETED
                    message: Сначала выполните условие задания.
                rewardAlreadyClaimed:
                  value:
                    code: TASK_REWARD_ALREADY_CLAIMED
                    message: Награда за это задание уже получена.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/daily-report:
    get:
      tags: [Ежедневная сводка]
      operationId: getDailyReport
      summary: Получить сводку активности за сегодня
      description: |
        Возвращает текущую сводку авторизованного пользователя за календарный день в UTC.
        Количество заработанных листьев передаётся первым полем. В `tasks` входят только
        выполненные сегодня задания, а в `rewards` — награды, полученные сегодня.
      responses:
        '200':
          description: Текущая ежедневная сводка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportResponse'
              examples:
                default:
                  value:
                    leavesEarnedToday: 150
                    date: '2026-08-05'
                    rewards:
                      - rewardId: 96b41fc5-1a5f-4db4-9129-555555555555
                        type: PROMOTION_DISCOUNT
                        title: Скидка 20% на продвижение
                        expiresAt: '2026-09-01'
                        receivedAt: '2026-08-05T10:00:00Z'
                    levelUp:
                      fromLevel: 3
                      toLevel: 4
                      occurredAt: '2026-08-05T10:00:00Z'
                    tasks:
                      - taskId: 8f123af2-24c5-4ff7-b114-111111111111
                        type: OPEN_NOTIFICATIONS
                        description: Открыть 5 уведомлений
                        rewardLeaves: 45
                        rewardClaimed: true
                        completedAt: '2026-08-05T09:15:00Z'
                      - taskId: 6ab41fc5-1a5f-4db4-9129-222222222222
                        type: ADD_TO_FAVORITES
                        description: Добавить 3 объявления в избранное
                        rewardLeaves: 45
                        rewardClaimed: false
                        completedAt: '2026-08-05T11:20:00Z'
                    visitedToday: true
                    updatedAt: '2026-08-05T11:20:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/daily-report/ws:
    get:
      tags: [Ежедневная сводка]
      operationId: subscribeDailyReport
      summary: Подписаться на обновления ежедневной сводки
      description: |
        WebSocket-подключение для авторизованного пользователя. После успешного подключения
        сервер сразу отправляет событие `DAILY_REPORT_UPDATED` с текущей сводкой, затем
        повторяет его при изменении сводки: начислении листьев, выполнении или получении
        награды за задание, получении другой награды, повышении уровня и смене дня в UTC.

        Каждое сообщение содержит полный снимок `data`, а не только изменившиеся поля.
        Это позволяет фронтенду заменить локальную сводку одним сообщением.
      x-websocket:
        serverMessages:
          event: DAILY_REPORT_UPDATED
          schema:
            $ref: '#/components/schemas/DailyReportUpdatedEvent'
      responses:
        '101':
          description: Соединение переключено на протокол WebSocket.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/leaderboard:
    get:
      tags: [Рейтинг]
      operationId: getLeaderboard
      summary: Получить текущую десятку лидеров месяца
      description: |
        Возвращает до 10 игроков из последнего успешно опубликованного снимка
        за текущий календарный месяц в UTC. Элементы упорядочены по техническому
        полю `position`.
      responses:
        '200':
          description: Текущий снимок рейтинга.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
              examples:
                default:
                  value:
                    period:
                      key: '2026-08'
                      startAt: '2026-08-01T00:00:00Z'
                      endAt: '2026-09-01T00:00:00Z'
                    calculatedAt: '2026-08-12T00:00:00Z'
                    nextCalculationAt: '2026-08-13T00:00:00Z'
                    items:
                      - playerId: 8f123af2-24c5-4ff7-b114-111111111111
                        nickname: Капибосс
                        position: 1
                      - playerId: 6ab41fc5-1a5f-4db4-9129-222222222222
                        nickname: Листик
                        position: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LeaderboardNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/leaderboard/me:
    get:
      tags: [Рейтинг]
      operationId: getMyLeaderboardPosition
      summary: Получить позицию авторизованного игрока в рейтинге за месяц
      description: |
        Определяет игрока по Bearer-токену и возвращает его строку из последнего
        успешно опубликованного снимка. Клиент не может передать идентификатор игрока.
      responses:
        '200':
          description: Данные авторизованного игрока в рейтинге.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyLeaderboardResponse'
              examples:
                default:
                  value:
                    period:
                      key: '2026-08'
                      startAt: '2026-08-01T00:00:00Z'
                      endAt: '2026-09-01T00:00:00Z'
                    calculatedAt: '2026-08-12T00:00:00Z'
                    nextCalculationAt: '2026-08-13T00:00:00Z'
                    player:
                      playerId: 72482c10-6976-4823-a835-333333333333
                      nickname: Коробыш
                      position: 148
                      isTop10: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '503':
          $ref: '#/components/responses/LeaderboardNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/weekly-login:
    get:
      tags: [Еженедельный вход]
      operationId: getWeeklyLogin
      summary: Получить текущий цикл еженедельных входов
      description: |
        Возвращает текущий недельный цикл авторизованного пользователя с понедельника
        по воскресенье в UTC, состояние получения награды за сегодня и все дни цикла.
      responses:
        '200':
          description: Текущее состояние еженедельных входов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyLoginResponse'
              examples:
                default:
                  value:
                    cycle:
                      isoWeek: 2026-W32
                      startDate: '2026-08-03'
                      endDate: '2026-08-09'
                    today:
                      date: '2026-08-05'
                      status: AVAILABLE
                      rewardLeaves: 30
                    days:
                      - date: '2026-08-03'
                        weekday: 1
                        status: CLAIMED
                        rewardLeaves: 10
                      - date: '2026-08-04'
                        weekday: 2
                        status: AVAILABLE
                        rewardLeaves: 20
                      - date: '2026-08-05'
                        weekday: 3
                        status: AVAILABLE
                        rewardLeaves: 30
                      - date: '2026-08-06'
                        weekday: 4
                        status: FUTURE
                        rewardLeaves: 40
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/weekly-login/claim:
    post:
      tags: [Еженедельный вход]
      operationId: claimWeeklyLogin
      summary: Получить накопившиеся награды текущей недели
      description: |
        Выдаёт все ещё не полученные награды за дни текущей UTC-недели
        с понедельника по текущую дату, в которые вход пользователя был подтверждён.
        Незабранная награда не сгорает в конце дня и остаётся доступной до конца этой недели.

        Дата из запроса используется для проверки согласованности. Даты и размеры наград
        определяет сервер.

        День со статусом `INACTIVE` пропускается. Статус `UNKNOWN` или недоступность внешнего сервиса
        обрабатываются по принципу fail-open: награда за такой день выдаётся со статусом проверки `PENDING`.
        Уже выданная награда впоследствии не отзывается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyLoginClaimRequest'
            examples:
              default:
                value:
                  date: '2026-08-05'
      responses:
        '200':
          description: Все накопившиеся награды текущей недели выданы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyLoginClaimResponse'
              examples:
                confirmed:
                  value:
                    claims:
                      - date: '2026-08-04'
                        leaves: 20
                        verification: CONFIRMED
                        grantedAt: '2026-08-05T09:34:12Z'
                      - date: '2026-08-05'
                        leaves: 30
                        verification: CONFIRMED
                        grantedAt: '2026-08-05T09:34:12Z'
                    progression:
                      level: 5
                      lifetimeLeaves: 260
                      walletLeaves: 0
                      crossedLevels: [4, 5]
                      version: 18
                pending:
                  value:
                    claims:
                      - date: '2026-08-04'
                        leaves: 20
                        verification: CONFIRMED
                        grantedAt: '2026-08-05T09:34:12Z'
                      - date: '2026-08-05'
                        leaves: 30
                        verification: PENDING
                        grantedAt: '2026-08-05T09:34:12Z'
                    progression:
                      level: 5
                      lifetimeLeaves: 260
                      walletLeaves: 0
                      crossedLevels: [4, 5]
                      version: 18
        '400':
          description: Запрос составлен неверно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: В текущей неделе до сегодня не было ни одного дня с подтверждённой или ожидающей проверки активностью.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                activityNotConfirmed:
                  value:
                    code: ACTIVITY_NOT_CONFIRMED
                    message: На текущей неделе нет дней с подтверждённой активностью
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '409':
          description: Активные дни в текущей неделе есть, но все награды за них уже получены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyClaimed:
                  value:
                    code: ALREADY_CLAIMED
                    message: Все доступные награды текущей недели уже получены
        '422':
          description: Дата в запросе не совпадает с текущей датой сервера в UTC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notToday:
                  value:
                    code: NOT_TODAY
                    message: Запрошенная дата должна совпадать с текущей датой в UTC
                    details:
                      serverDate: '2026-08-05'
                      requestedDate: '2026-08-04'
        '429':
          description: Превышен лимит запросов на получение награды — 10 попыток в минуту на пользователя.
          headers:
            Retry-After:
              description: Количество секунд до следующей разрешённой попытки.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rateLimited:
                  value:
                    code: RATE_LIMITED
                    message: Слишком много попыток получить награду
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/external/v1/users/{userId}/activity:
    get:
      tags: [Внешняя активность]
      operationId: getExternalUserActivity
      summary: Получить внешнюю активность за диапазон дат в UTC
      description: |
        Контракт внешнего сервиса, используемого бэкендом. Для этой операции не
        применяется Bearer-токен игрока из приложения; межсервисную аутентификацию
        необходимо настроить отдельно.
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Идентификатор пользователя во внешней системе.
          schema:
            type: string
        - name: dateFrom
          in: query
          required: true
          description: Начальная календарная дата в UTC, включительно.
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: true
          description: Конечная календарная дата в UTC, включительно.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Состояние активности для каждой запрошенной даты в UTC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalActivityResponse'
              examples:
                default:
                  value:
                    userId: 8f123af2
                    window:
                      dateFrom: '2026-08-03'
                      dateTo: '2026-08-09'
                    generatedAt: '2026-08-05T12:00:00Z'
                    completeUntil: '2026-08-04'
                    days:
                      - date: '2026-08-03'
                        status: ACTIVE
                        firstActivityAt: '2026-08-03T07:15:00Z'
                        activityCount: 12
                      - date: '2026-08-04'
                        status: INACTIVE
                        firstActivityAt: null
                        activityCount: 0
                      - date: '2026-08-05'
                        status: UNKNOWN
                        firstActivityAt: null
                        activityCount: null
        '400':
          description: Некорректный диапазон дат или параметры.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка внешнего сервиса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Bearer-токен отсутствует или недействителен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                code: UNAUTHORIZED
                message: Требуется аутентификация
    PlayerNotFound:
      description: Авторизованный игрок не существует.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            playerNotFound:
              value:
                code: PLAYER_NOT_FOUND
                message: Авторизованный игрок не найден
    LeaderboardNotReady:
      description: Ни одного успешно рассчитанного снимка рейтинга ещё не опубликовано.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notReady:
              value:
                code: LEADERBOARD_NOT_READY
                message: Рейтинг ещё не рассчитан
                details:
                  nextCalculationAt: '2026-08-05T00:00:00Z'
    InternalError:
      description: Непредвиденная ошибка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                code: INTERNAL_ERROR
                message: Внутренняя ошибка сервера

  schemas:
    HealthResponse:
      type: object
      required: [service, status, time]
      properties:
        service:
          type: string
          enum: [go-api]
          description: Имя сервиса.
        status:
          type: string
          enum: [ready]
          description: Текущее состояние готовности сервиса.
        time:
          type: string
          format: date-time
          description: Текущее время сервера в UTC.

    OtpRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Адрес электронной почты для получения одноразового кода.
          example: user@example.com

    OtpVerificationRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          description: Адрес электронной почты, на который был отправлен код.
          example: user@example.com
        code:
          type: string
          pattern: '^\d{6,10}$'
          minLength: 6
          maxLength: 10
          description: Цифровой одноразовый код. Длина задаётся конфигурацией сервера, по умолчанию — 8 цифр.
          example: '12345678'

    OtpSentResponse:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean
          enum: [true]
          description: Подтверждает успешную отправку одноразового кода.

    UserResponse:
      type: object
      required: [id, email, verified]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор пользователя.
        email:
          type: string
          format: email
          description: Нормализованный адрес электронной почты пользователя.
        verified:
          type: boolean
          description: Подтверждён ли адрес электронной почты одноразовым кодом.

    AuthResponse:
      type: object
      required: [token, record]
      properties:
        token:
          type: string
          description: JWT для передачи в заголовке `Authorization` последующих запросов.
        record:
          $ref: '#/components/schemas/UserResponse'

    AuthErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Текст ошибки.

    DailyTaskType:
      type: string
      description: |
        Действие, прогресс которого учитывается для задания:
        - `OPEN_NOTIFICATIONS` — открыть уведомления;
        - `ADD_TO_FAVORITES` — добавить объявления в избранное;
        - `PUBLISH_LISTING` — успешно опубликовать объявления;
        - `BOOST_LISTING` — применить поднятие к своим объявлениям;
        - `LEAVE_REVIEW` — успешно опубликовать отзывы;
        - `COMPLETE_DEAL` — завершить покупки или продажи;
        - `ORDER_WITH_DELIVERY` — оформить заказы с Авито Доставкой.

        Требуемое количество действий задаётся полем `targetCount`, а не типом.
      enum:
        - OPEN_NOTIFICATIONS
        - ADD_TO_FAVORITES
        - PUBLISH_LISTING
        - BOOST_LISTING
        - LEAVE_REVIEW
        - COMPLETE_DEAL
        - ORDER_WITH_DELIVERY

    DailyTaskStatus:
      type: string
      description: |
        `LOCKED` — задание недоступно по уровню;
        `IN_PROGRESS` — условие ещё не выполнено;
        `COMPLETED` — условие выполнено, награду можно забрать;
        `CLAIMED` — награда уже начислена.
      enum:
        - LOCKED
        - IN_PROGRESS
        - COMPLETED
        - CLAIMED

    DailyTask:
      type: object
      required:
        - taskId
        - slot
        - type
        - description
        - currentCount
        - targetCount
        - rewardLeaves
        - requiredLevel
        - status
      properties:
        taskId:
          type: string
          format: uuid
          description: Идентификатор задания текущего дня.
        slot:
          type: integer
          format: int32
          minimum: 1
          maximum: 4
          description: Позиция задания в списке.
        type:
          $ref: '#/components/schemas/DailyTaskType'
        description:
          type: string
          minLength: 1
          description: Готовый текст условия для отображения пользователю.
        currentCount:
          type: integer
          format: int32
          minimum: 0
          description: Подтверждённое количество выполненных действий.
        targetCount:
          type: integer
          format: int32
          minimum: 1
          description: Количество действий, необходимое для выполнения задания.
        rewardLeaves:
          type: integer
          format: int32
          minimum: 1
          description: Количество листьев за получение награды.
        requiredLevel:
          type: integer
          format: int32
          enum: [1, 5, 10]
          description: Минимальный уровень питомца для доступа к заданию.
        status:
          $ref: '#/components/schemas/DailyTaskStatus'

    DailyTasksResponse:
      type: object
      required: [petLevel, tasks]
      properties:
        petLevel:
          type: integer
          format: int32
          minimum: 1
          description: Текущий уровень питомца, используемый для определения доступа.
        tasks:
          type: array
          minItems: 4
          maxItems: 4
          description: Все четыре задания текущего дня в порядке слотов.
          items:
            $ref: '#/components/schemas/DailyTask'

    DailyTasksProgressResponse:
      type: object
      required: [completedCount, totalCount]
      properties:
        completedCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 4
          description: Количество заданий со статусом COMPLETED или CLAIMED.
        totalCount:
          type: integer
          format: int32
          enum: [4]
          description: Общее количество заданий дня, включая заблокированные.

    DailyTaskClaimResponse:
      type: object
      required: [taskId, rewardLeaves, status]
      properties:
        taskId:
          type: string
          format: uuid
        rewardLeaves:
          type: integer
          format: int32
          minimum: 1
          description: Фактически начисленное количество листьев.
        status:
          type: string
          enum: [CLAIMED]

    DailyReportRewardType:
      type: string
      description: |
        Тип награды из раздела «Награды»:
        - `AVITO_BONUS` — фиксированное количество бонусов для оплаты поддерживаемых услуг Авито;
        - `FREE_DELIVERY` — бесплатная доставка для указанного количества заказов;
        - `FREE_PROMOTION` — бесплатное продвижение объявления;
        - `PROMOTION_DISCOUNT` — процентная скидка на продвижение;
        - `DELIVERY_DISCOUNT` — процентная скидка на Авито Доставку.

        Номинал, процент, количество применений и ограничения задаются конкретной
        наградой и отражаются в её `title`; поле `type` определяет только назначение.
      enum:
        - AVITO_BONUS
        - FREE_DELIVERY
        - FREE_PROMOTION
        - PROMOTION_DISCOUNT
        - DELIVERY_DISCOUNT

    DailyReportReward:
      type: object
      required: [rewardId, type, title, expiresAt, receivedAt]
      properties:
        rewardId:
          type: string
          format: uuid
          description: Уникальный идентификатор полученной награды.
        type:
          $ref: '#/components/schemas/DailyReportRewardType'
        title:
          type: string
          minLength: 1
          description: Название награды для отображения.
        expiresAt:
          type: string
          format: date
          description: Дата окончания действия награды в UTC.
        receivedAt:
          type: string
          format: date-time
          description: Время получения награды в UTC.

    DailyReportTask:
      type: object
      required: [taskId, type, description, rewardLeaves, rewardClaimed, completedAt]
      properties:
        taskId:
          type: string
          format: uuid
          description: Идентификатор выполненного задания.
        type:
          $ref: '#/components/schemas/DailyTaskType'
        description:
          type: string
          minLength: 1
          description: Текст выполненного задания.
        rewardLeaves:
          type: integer
          format: int32
          minimum: 1
          description: Количество листьев за получение награды задания.
        rewardClaimed:
          type: boolean
          description: Были ли листья за это задание уже начислены.
        completedAt:
          type: string
          format: date-time
          description: Время выполнения условия задания в UTC.

    DailyReportLevelUp:
      type: object
      required: [fromLevel, toLevel, occurredAt]
      properties:
        fromLevel:
          type: integer
          format: int32
          minimum: 1
          description: Уровень питомца до повышения.
        toLevel:
          type: integer
          format: int32
          minimum: 2
          description: Текущий уровень после повышения. Может быть больше `fromLevel + 1`.
        occurredAt:
          type: string
          format: date-time
          description: Время первого повышения уровня за день в UTC.

    DailyReportResponse:
      type: object
      required: [leavesEarnedToday, date, rewards, levelUp, tasks, visitedToday, updatedAt]
      properties:
        leavesEarnedToday:
          type: integer
          format: int32
          minimum: 0
          description: Общее количество листьев, фактически полученных пользователем сегодня.
        date:
          type: string
          format: date
          description: Календарная дата сводки в UTC.
        rewards:
          type: array
          description: Награды, полученные пользователем сегодня, в порядке получения.
          items:
            $ref: '#/components/schemas/DailyReportReward'
        levelUp:
          allOf:
            - $ref: '#/components/schemas/DailyReportLevelUp'
          nullable: true
          description: Повышение уровня за сегодня; `null`, если уровня не было.
        tasks:
          type: array
          description: Выполненные сегодня задания в порядке выполнения.
          items:
            $ref: '#/components/schemas/DailyReportTask'
        visitedToday:
          type: boolean
          description: Открывал ли пользователь приложение сегодня.
        updatedAt:
          type: string
          format: date-time
          description: Время последнего изменения сводки в UTC.

    DailyReportUpdatedEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          enum: [DAILY_REPORT_UPDATED]
          description: Тип серверного WebSocket-сообщения.
        data:
          $ref: '#/components/schemas/DailyReportResponse'

    LeaderboardPeriod:
      type: object
      required: [key, startAt, endAt]
      properties:
        key:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: '2026-08'
        startAt:
          type: string
          format: date-time
          description: Начало месяца в UTC, включительно.
        endAt:
          type: string
          format: date-time
          description: Начало следующего месяца в UTC, не включительно.

    LeaderboardItem:
      type: object
      required: [playerId, nickname, position]
      properties:
        playerId:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 1
        position:
          type: integer
          format: int64
          minimum: 1
          description: Техническая позиция после стабильной сортировки.

    MyLeaderboardItem:
      allOf:
        - $ref: '#/components/schemas/LeaderboardItem'
        - type: object
          required: [isTop10]
          properties:
            isTop10:
              type: boolean
              description: Равно true, если позиция не превышает 10.

    LeaderboardResponse:
      type: object
      required: [period, calculatedAt, nextCalculationAt, items]
      properties:
        period:
          $ref: '#/components/schemas/LeaderboardPeriod'
        calculatedAt:
          type: string
          format: date-time
          description: Временная метка последнего успешно опубликованного снимка.
        nextCalculationAt:
          type: string
          format: date-time
          description: Время следующего запланированного ежедневного расчёта — 00:00 UTC.
        items:
          type: array
          minItems: 0
          maxItems: 10
          description: Упорядочены по возрастанию технической позиции.
          items:
            $ref: '#/components/schemas/LeaderboardItem'

    MyLeaderboardResponse:
      type: object
      required: [period, calculatedAt, nextCalculationAt, player]
      properties:
        period:
          $ref: '#/components/schemas/LeaderboardPeriod'
        calculatedAt:
          type: string
          format: date-time
        nextCalculationAt:
          type: string
          format: date-time
        player:
          $ref: '#/components/schemas/MyLeaderboardItem'

    WeeklyLoginCycle:
      type: object
      required: [isoWeek, startDate, endDate]
      properties:
        isoWeek:
          type: string
          pattern: '^\d{4}-W(0[1-9]|[1-4]\d|5[0-3])$'
          example: 2026-W32
        startDate:
          type: string
          format: date
          description: Понедельник, с которого начинается цикл в UTC.
        endDate:
          type: string
          format: date
          description: Воскресенье, которым заканчивается цикл в UTC.

    WeeklyLoginDayStatus:
      type: string
      enum:
        - CLAIMED
        - AVAILABLE
        - UNCONFIRMED
        - MISSED
        - FUTURE
        - BEFORE_REGISTRATION

    WeeklyLoginToday:
      type: object
      required: [date, status, rewardLeaves]
      properties:
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/WeeklyLoginDayStatus'
        rewardLeaves:
          type: integer
          format: int32
          minimum: 1
          nullable: true

    WeeklyLoginDay:
      type: object
      required: [date, weekday, status, rewardLeaves]
      properties:
        date:
          type: string
          format: date
        weekday:
          type: integer
          format: int32
          minimum: 1
          maximum: 7
          description: Понедельник обозначается числом 1, воскресенье — числом 7.
        status:
          $ref: '#/components/schemas/WeeklyLoginDayStatus'
        rewardLeaves:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Равно null для дней со статусом MISSED или BEFORE_REGISTRATION.

    WeeklyLoginResponse:
      type: object
      required: [cycle, today, days]
      properties:
        cycle:
          $ref: '#/components/schemas/WeeklyLoginCycle'
        today:
          $ref: '#/components/schemas/WeeklyLoginToday'
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: '#/components/schemas/WeeklyLoginDay'

    WeeklyLoginClaimRequest:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: Должна совпадать с текущей датой сервера в UTC.

    ClaimVerification:
      type: string
      enum: [CONFIRMED, PENDING, FAILED]

    WeeklyLoginClaim:
      type: object
      required: [date, leaves, verification, grantedAt]
      properties:
        date:
          type: string
          format: date
        leaves:
          type: integer
          format: int32
          minimum: 1
        verification:
          $ref: '#/components/schemas/ClaimVerification'
        grantedAt:
          type: string
          format: date-time

    Progression:
      type: object
      required: [level, lifetimeLeaves, walletLeaves, crossedLevels, version]
      properties:
        level:
          type: integer
          format: int32
          minimum: 0
        lifetimeLeaves:
          type: integer
          format: int64
          minimum: 0
        walletLeaves:
          type: integer
          format: int64
          minimum: 0
        crossedLevels:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
        version:
          type: integer
          format: int64
          minimum: 0

    WeeklyLoginClaimResponse:
      type: object
      required: [claims, progression]
      properties:
        claims:
          type: array
          minItems: 1
          maxItems: 7
          description: Все награды, выданные этим запросом, в порядке дат.
          items:
            $ref: '#/components/schemas/WeeklyLoginClaim'
        progression:
          $ref: '#/components/schemas/Progression'

    ExternalActivityStatus:
      type: string
      enum: [ACTIVE, INACTIVE, UNKNOWN, BEFORE_REGISTRATION]

    ExternalActivityWindow:
      type: object
      required: [dateFrom, dateTo]
      properties:
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date

    ExternalActivityDay:
      type: object
      required: [date, status, firstActivityAt, activityCount]
      properties:
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ExternalActivityStatus'
        firstActivityAt:
          type: string
          format: date-time
          nullable: true
        activityCount:
          type: integer
          format: int64
          minimum: 0
          nullable: true

    ExternalActivityResponse:
      type: object
      required: [userId, window, generatedAt, completeUntil, days]
      properties:
        userId:
          type: string
        window:
          $ref: '#/components/schemas/ExternalActivityWindow'
        generatedAt:
          type: string
          format: date-time
        completeUntil:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/ExternalActivityDay'

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Стабильный машиночитаемый код ошибки.
        message:
