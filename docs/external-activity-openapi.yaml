openapi: 3.1.0

info:
  title: External User Login Activity API
  version: 1.0.0
  description: |
    Service-to-service API for checking whether a user logged in on a set of
    UTC calendar dates.

    Every requested date must have exactly one corresponding item in the
    response. The order of response items is not guaranteed.

paths:
  /external/v1/login-activity/query:
    post:
      operationId: queryUserLoginActivity
      summary: Get login activity for a list of dates
      description: |
        Returns the user's login status for every requested UTC calendar date.
        This is a read-only operation; POST is used because the query contains
        an arbitrary list of dates in a JSON body.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          description: Optional request identifier used for distributed tracing.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginActivityRequest"
            example:
              userId: 8f123af2-0000-4000-8000-000000000000
              dates:
                - "2026-08-03"
                - "2026-08-04"
                - "2026-08-06"
      responses:
        "200":
          description: A result is returned for every requested date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginActivityResponse"
              example:
                days:
                  - date: "2026-08-03"
                    status: ACTIVE
                  - date: "2026-08-04"
                    status: INACTIVE
                  - date: "2026-08-06"
                    status: FUTURE
        "400":
          description: Malformed JSON or an invalid request parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_REQUEST
                message: dates must contain between 1 and 31 unique UTC dates
        "401":
          description: Missing or invalid service credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The requested user does not exist in the activity service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: USER_NOT_FOUND
                message: user was not found
        "429":
          description: Request rate limit exceeded.
          headers:
            Retry-After:
              description: Seconds until the request may be retried.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected activity service error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Activity data is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginActivityRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - dates
      properties:
        userId:
          type: string
          format: uuid
          description: Full user UUID; shortened identifiers are not accepted.
        dates:
          type: array
          minItems: 1
          maxItems: 31
          uniqueItems: true
          description: Unique UTC calendar dates to check.
          items:
            type: string
            format: date

    LoginActivityResponse:
      type: object
      additionalProperties: false
      required:
        - days
      properties:
        days:
          type: array
          minItems: 1
          description: |
            Contains exactly one item for every date from the request and no
            additional dates. Callers must match entries by date, not by array
            position.
          items:
            $ref: "#/components/schemas/LoginActivityDay"

    LoginActivityDay:
      type: object
      additionalProperties: false
      required:
        - date
        - status
      properties:
        date:
          type: string
          format: date
          description: UTC calendar date from the request.
        status:
          $ref: "#/components/schemas/LoginActivityStatus"

    LoginActivityStatus:
      type: string
      description: |
        FUTURE means the requested date has not occurred yet. ACTIVE means at
        least one login was found. INACTIVE means no login was found.
        BEFORE_REGISTRATION means the requested date precedes the user's
        registration date.
      enum:
        - FUTURE
        - ACTIVE
        - INACTIVE
        - BEFORE_REGISTRATION

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: invalid request
