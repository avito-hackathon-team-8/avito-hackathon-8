name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Проверить код
        run: npm run lint

      - name: Проверить стили
        run: npm run lint:styles

      - name: Собрать приложение
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Проверить тесты
        run: go test ./...

      - name: Проверить конкурентность
        run: go test -race ./...

      - name: Проверить код
        run: go vet ./...

      - name: Проверить форматирование
        run: test -z "$(gofmt -l .)"

      - name: Запустить линтер
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
          args: --config ../.golangci.yaml

  puppeteer:
    name: Puppeteer
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/puppeteer_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: puppeteer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d puppeteer_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    defaults:
      run:
        working-directory: puppeteer
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: puppeteer/go.sum

      - name: Проверить тесты
        run: go test ./...

      - name: Проверить конкурентность
        run: go test -race ./...

      - name: Проверить код
        run: go vet ./...

      - name: Проверить форматирование
        run: test -z "$(gofmt -l .)"

      - name: Запустить линтер
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: puppeteer
          args: --config ../.golangci.yaml

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить пробелы и конфликтующие изменения
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Подготовить переменные окружения
        run: cp .env.example .env

      - name: Собрать Docker-образы
        run: docker compose -f compose.yaml build
