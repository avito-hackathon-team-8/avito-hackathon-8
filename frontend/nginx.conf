limit_req_zone $binary_remote_addr zone=registration_per_ip:10m rate=2r/m;
limit_req_zone $server_name zone=registration_global:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=verification_per_ip:10m rate=6r/m;
limit_req_zone $server_name zone=verification_global:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $server_name zone=api_global:1m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

server {
    listen 80;
    server_name _;

    deny 85.93.10.78;
    deny 5.231.105.130;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn connections_per_ip 30;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/app/auth/request-otp {
        limit_req zone=registration_per_ip burst=2 nodelay;
        limit_req zone=registration_global burst=10 nodelay;

        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/app/auth/verify-otp {
        limit_req zone=verification_per_ip burst=5 nodelay;
        limit_req zone=verification_global burst=20 nodelay;

        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_req zone=api_global burst=200 nodelay;

        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /swagger {
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
